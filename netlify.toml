[build]
  command = "cd server && npm install && npx prisma generate && cd ../client && npm install --include=dev && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/prisma/**"]

[functions."api"]
  external_node_modules = ["@prisma/client", "@prisma/adapter-libsql", "@libsql/client"]

[functions."cron-reminders"]
  external_node_modules = ["@prisma/client", "@prisma/adapter-libsql", "@libsql/client"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
