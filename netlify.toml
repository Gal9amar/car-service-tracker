[build]
  command = "cd server && npm install && npx prisma generate && cp -r node_modules netlify_node_modules && cd ../client && npm install --include=dev && npm run build && cd .. && mv server/netlify_node_modules netlify/functions/node_modules"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@prisma/adapter-libsql", "@libsql/client", "bcryptjs", "express", "jsonwebtoken", "zod", "cors", "helmet", "cookie-parser", "express-rate-limit", "nodemailer", "node-cron", "pdfkit", "multer", "passport", "passport-local", "passport-google-oauth20"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
