[build]
  command = "cd server && npm install && npx prisma generate && cd .. && npx prisma generate --schema=server/prisma/schema.prisma && cd client && npm install --include=dev && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/**", "node_modules/@prisma/client/**", "server/prisma/**"]

[functions."api"]
  external_node_modules = ["@libsql/client"]

[functions."cron-reminders"]
  external_node_modules = ["@libsql/client"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
